<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeatSync Ad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700;800&display=swap">
<style>
html, body { height:100%; margin:0; background:#111418; color:#E9EDF3; font:14px/1.4 Inter, system-ui, sans-serif }
body { display:flex; flex-direction:column }
#wrap { position:relative; flex:1; min-height:0; overflow:hidden }
#stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; overflow:hidden; background:#F6F8FB;
  --display:"Space Grotesk", "Space Grotesk", system-ui, sans-serif; --sans:"Inter", system-ui, sans-serif }
#controls { display:flex; align-items:center; gap:12px; padding:10px 16px; background:#1A1F26 }
#controls button { font:600 14px Inter, system-ui, sans-serif; color:#E9EDF3; background:#2B323C; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; min-width:84px }
#controls button:hover { background:#38414D } #controls button:focus-visible { outline:2px solid #8FB4FF; outline-offset:2px }
#scrub { flex:1; min-width:0 } #time { font-variant-numeric:tabular-nums; min-width:92px; text-align:right }
#stage { --ground:#F6F8FB; --main:#1B2F5B; --second:#0E1A33; --accent:#F4A62A; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }
.ground { position:absolute; inset:0; background:var(--ground) }
.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:20px } .words > * { margin:0 }
.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:96px; line-height:1.05; font-weight:700; letter-spacing:-0.01em } .sub { font-size:40px; line-height:1.25 }
#stage { --wall:color-mix(in srgb, var(--ground) 88%, var(--main)); --wall2:color-mix(in srgb, var(--ground) 76%, var(--main)); --floor:color-mix(in srgb, var(--ground) 62%, var(--main)); --soft:color-mix(in srgb, var(--main) 55%, var(--ground)); --skin:color-mix(in srgb, var(--accent) 38%, var(--ground)); --note:color-mix(in srgb, var(--accent) 60%, var(--ground)); --desk:color-mix(in srgb, var(--accent) 22%, var(--ground)); --desk2:color-mix(in srgb, var(--accent) 30%, var(--main)); --hair:color-mix(in srgb, var(--accent) 25%, var(--second)); --screen-bg:color-mix(in srgb, var(--ground) 92%, var(--main)); --hairline:color-mix(in srgb, var(--main) 16%, transparent) }
.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }
.bubble { position:absolute; background:var(--ground); color:var(--second); border:5px solid var(--second); border-radius:40px; padding:26px 38px; font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:50px; font-weight:700; line-height:1.15; max-width:760px; box-shadow:8px 10px 0 var(--second) }
.bubble::after { content:''; position:absolute; bottom:-34px; left:var(--tail, 80px); width:46px; height:46px; background:var(--ground); border-right:5px solid var(--second); border-bottom:5px solid var(--second); transform:skewX(-28deg) rotate(45deg) translateY(-12px) }
.vo { left:820px; top:300px; width:960px; gap:26px } .vo .line { font-size:76px } .vo .sub { color:color-mix(in srgb, var(--second) 75%, var(--ground)) }
.tag { font-size:28px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--main) }
.phone { position:absolute; width:420px; height:860px; border-radius:60px; background:var(--second); padding:16px; box-sizing:border-box; box-shadow:0 40px 80px rgba(14,26,51,.22) }
.scr { position:relative; width:100%; height:100%; border-radius:46px; background:var(--screen-bg); overflow:hidden; display:flex; flex-direction:column; gap:14px }
.app-top { background:var(--main); color:var(--ground); padding:58px 28px 22px; display:flex; flex-direction:column; gap:6px } .app-brand { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:28px; font-weight:700; color:color-mix(in srgb, var(--ground) 75%, var(--main)) } .app-title { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:46px; font-weight:700 }
.game { margin:0 18px; padding:18px 22px; border-radius:22px; background:var(--ground); border:2px solid var(--hairline); display:flex; flex-direction:column; gap:6px }
.game-name { font-size:30px; font-weight:700 } .game-date { font-size:26px; color:color-mix(in srgb, var(--second) 60%, var(--ground)) }
.nums { display:flex; gap:28px; margin-top:6px } .num { display:flex; flex-direction:column } .num b { font-size:40px; font-variant-numeric:tabular-nums; line-height:1.1 } .num span { font-size:26px; color:color-mix(in srgb, var(--second) 60%, var(--ground)) }
.bar { height:12px; border-radius:6px; background:color-mix(in srgb, var(--main) 14%, transparent); margin-top:8px } .bar i { display:block; height:100%; border-radius:6px; background:var(--main) }
.pay { margin:0 18px; padding:18px 22px; border-radius:22px; background:var(--ground); border:2px solid var(--hairline); display:flex; flex-direction:column; gap:8px } .pay-row { display:flex; justify-content:space-between; align-items:center; gap:12px } .pay-amt { font-size:26px; color:color-mix(in srgb, var(--second) 70%, var(--ground)); font-variant-numeric:tabular-nums }
.pill { font-size:26px; font-weight:700; padding:6px 16px; border-radius:999px; background:color-mix(in srgb, var(--main) 12%, var(--ground)); color:var(--main) } .pill.flag { background:var(--accent); color:var(--second) }
.note-card { position:absolute; left:14px; right:14px; top:14px; background:var(--second); color:var(--ground); border-radius:28px; padding:22px 26px; display:flex; flex-direction:column; gap:4px; box-shadow:0 20px 40px rgba(14,26,51,.3) } .note-app { font-size:24px; color:color-mix(in srgb, var(--ground) 65%, var(--second)) } .note-big { font-size:36px; font-weight:700 } .note-small { font-size:26px }
.site { position:absolute; width:420px; background:var(--ground); border:3px solid var(--second); border-radius:22px; box-shadow:8px 10px 0 var(--second); display:flex; flex-direction:column } .site-bar { padding:14px 22px; border-bottom:3px solid var(--second); font-size:30px; font-weight:700; display:flex; gap:10px; align-items:center } .site-body { padding:20px 22px; display:flex; flex-direction:column; gap:10px; font-size:30px }
.seat { position:relative; padding:14px 18px; border-radius:14px; background:color-mix(in srgb, var(--main) 9%, var(--ground)); display:flex; justify-content:space-between; gap:10px } .seat-price { font-weight:700; font-variant-numeric:tabular-nums }
.stamp { position:absolute; right:10px; top:50%; padding:4px 14px; border:4px solid var(--accent); color:var(--accent); background:var(--ground); font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:700; font-size:30px; border-radius:10px }
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<div id="controls"><button id="play" type="button">Play</button><button id="restart" type="button">Restart</button><input id="scrub" type="range" min="0" value="0" aria-label="Timeline"><span id="time">0:00</span><button id="mute" type="button" aria-pressed="true">Sound on</button></div>
<script>// Local animation player: runs scene modules (init/render as pure functions of t) and a synthesized score.
(function () {
  const clamp01 = (x) => Math.max(0, Math.min(1, x));
  const ease = {
    clamp01, clamp: (x, a, b) => Math.max(a, Math.min(b, x)),
    seg: (t, a, b) => clamp01((t - a) / (b - a)),
    lerp: (a, b, p) => a + (b - a) * p,
    eo: (x) => 1 - Math.pow(1 - clamp01(x), 3),
    ei: (x) => Math.pow(clamp01(x), 3),
    eio: (x) => { x = clamp01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; },
    eob: (x, s = 1.4) => { x = clamp01(x); const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); },
    rng: (seed) => { let a = (seed * 2654435761) >>> 0 || 1; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; },
  };
  const TextFx = {
    split(el) {
      if (el._words) return el._words;
      const words = el.textContent.split(' ');
      el.textContent = '';
      el._words = words.map((w, i) => {
        const s = document.createElement('span');
        s.textContent = w; s.style.display = 'inline-block';
        el.appendChild(s);
        if (i < words.length - 1) el.appendChild(document.createTextNode(' '));
        return s;
      });
      return el._words;
    },
    fadeFromRight(el, t, t0, o = {}) {
      const st = o.stagger ?? 0.11, d = o.dur ?? 0.5, dx = o.dx ?? 30;
      TextFx.split(el).forEach((s, i) => {
        const p = ease.eo(ease.seg(t, t0 + i * st, t0 + i * st + d));
        s.style.opacity = p.toFixed(3);
        s.style.transform = 'translateX(' + ((1 - p) * dx).toFixed(1) + 'px)';
      });
    },
    fadeOutLeft(el, t, t0, o = {}) {
      const d = o.dur ?? 0.4, dx = o.dx ?? 30;
      TextFx.split(el).forEach((s) => { const p = ease.ei(ease.seg(t, t0, t0 + d)); s.style.opacity = (1 - p).toFixed(3); s.style.transform = 'translateX(' + (-p * dx).toFixed(1) + 'px)'; });
    },
  };

  const stageEl = document.getElementById('stage');
  const scenes = [], byId = {};
  let scoreFn = null;

  function makeKit(id) {
    const kit = Object.assign({}, ease, { TextFx, W: 1920, H: 1080 });
    if (id) {
      const layer = document.createElement('div');
      layer.className = 'scene-layer';
      layer.style.cssText = 'position:absolute;inset:0;overflow:hidden;display:none';
      stageEl.appendChild(layer);
      kit.stage = layer;
    }
    kit.h = (html) => {
      const tpl = document.createElement('template');
      tpl.innerHTML = html.trim();
      const kids = [...tpl.content.children];
      if (kids.length === 1) return kids[0];
      const box = document.createElement('div'); box.style.display = 'contents';
      kids.forEach((k) => box.appendChild(k)); return box;
    };
    kit.css = (text) => { const s = document.createElement('style'); s.textContent = text; document.head.appendChild(s); return s; };
    kit.scene = (sid, def) => { const s = byId[sid]; if (s) s.def = def; };
    kit.score = (fn) => { scoreFn = fn; };
    kit.scenes = () => null;
    return kit;
  }

  const Player = {
    setup(film) {
      let at = 0;
      film.scenes.forEach((s) => { const sc = { id: s.id, dur: s.dur, start: at, def: null, kit: makeKit(s.id) }; sc.kit.dur = s.dur; sc.kit.start = at; at += s.dur; scenes.push(sc); byId[s.id] = sc; });
      Player.END = at;
    },
    shared(fn) { fn(makeKit(null)); },
    scene(id, fn) { fn(byId[id].kit); },
    score(fn) { fn(makeKit(null)); },
    async boot() {
      for (const s of scenes) {
        try { if (s.def && s.def.init) await s.def.init.call(s.def, s.kit); }
        catch (e) { console.error('init failed: ' + s.id, e); s.def = null; }
      }
      Audio.build();
      UI.init();
      const qt = parseFloat(new URLSearchParams(location.search).get('t')); Player.show(isNaN(qt) ? 0 : qt); if (!isNaN(qt)) UI.t = qt;
    },
    current: null,
    show(t) {
      t = Math.max(0, Math.min(Player.END - 1e-4, t));
      const s = scenes.find((x) => t >= x.start && t < x.start + x.dur) || scenes[scenes.length - 1];
      if (Player.current !== s) { if (Player.current) Player.current.kit.stage.style.display = 'none'; s.kit.stage.style.display = 'block'; Player.current = s; }
      if (s.def) { try { s.def.render.call(s.def, t - s.start, s.kit); } catch (e) { console.error('render failed: ' + s.id, e); } }
      UI.update(t);
    },
  };

  // ---------- Score: a recorder for S, then a small Web Audio synth ----------
  const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const midi = (p) => { if (typeof p === 'number') return p; const m = /^([A-G])([#b]?)(-?\d)$/.exec(p); if (!m) return 60; return 12 * (+m[3] + 1) + NOTE[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0); };
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);

  const Audio = {
    events: [], programs: {}, master: { gain: 0, fadeOut: 0 }, ctx: null, live: [], muted: false,
    build() {
      if (!scoreFn) return;
      const T = { END: Player.END }; scenes.forEach((s) => { T[s.id] = s.start; });
      let B = 0.5, t0 = 0; const ev = this.events, progs = this.programs, self = this;
      const when = (o) => o.t != null ? [o.t, o.dur ?? 0.5] : [t0 + (o.beat || 0) * B, (o.beats ?? 1) * B];
      const S = {
        tempo(bpm, o = {}) { B = 60 / bpm; t0 = o.t0 || 0; },
        beat(n) { return t0 + n * B; },
        program(track, patch, o = {}) { progs[track] = Object.assign({ patch }, o); },
        note(track, p, o = {}) { const [t, d] = when(o); ev.push({ k: 'note', track, m: midi(p), t, d, v: o.vel ?? 64 }); },
        chord(track, ps, o = {}) { ps.forEach((p) => S.note(track, p, o)); },
        pattern(track, str, o = {}) {
          const rep = o.repeat ?? 1, pitches = o.pitch || ['C4']; let n = 0;
          for (let r = 0; r < rep; r++) for (let i = 0; i < str.length; i++) {
            const c = str[i]; if (c === '.' || c === ' ') continue;
            const v = (o.vel ?? 64) * (c === 'X' ? 1.25 : c === 'o' ? 0.5 : 1);
            if (v > 0) S.note(track, pitches[n % pitches.length], { beat: (o.from || 0) + (r * str.length + i) * 0.5, beats: 0.5, vel: v });
            n++;
          }
        },
        drum(name, o = {}) { const [t] = when(o); ev.push({ k: 'drum', name, t, v: o.vel ?? 80 }); },
        drums(map, o = {}) { const rep = o.repeat ?? 1; for (const name in map) { const str = map[name]; for (let r = 0; r < rep; r++) for (let i = 0; i < str.length; i++) { const c = str[i]; if (c === '.' || c === ' ') continue; S.drum(name, { beat: (o.from || 0) + (r * str.length + i) * 0.5, vel: c === 'X' ? 100 : c === 'o' ? 40 : 75 }); } } },
        fx(name, t, o = {}) { ev.push({ k: 'fx', name, t, v: o.vel ?? 70, pitch: o.pitch ?? 1, d: o.dur ?? 0.5, into: o.into }); },
        ticks(times, o = {}) { times.forEach((t) => ev.push({ k: 'fx', name: 'tick', t, v: o.vel ?? 50, pitch: 1 })); },
        run(track, ps, o = {}) { ps.forEach((p, i) => S.note(track, p, { t: o.t + i * (o.step || 0.1), dur: o.step || 0.1, vel: (o.vel ?? 60) + (o.cresc || 0) * i })); },
        master(o) { Object.assign(self.master, o); },
      };
      try { scoreFn(S, T); } catch (e) { console.error('score failed', e); }
      this.events = ev.filter((e) => e.t > -0.1).sort((a, b) => a.t - b.t);
    },
    ensure() {
      if (!this.ctx) {
        const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
        this.ctx = new C();
        this.out = this.ctx.createGain(); this.out.connect(this.ctx.destination);
        const len = this.ctx.sampleRate; this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = this.noise.getChannelData(0); const r = ease.rng(3); for (let i = 0; i < len; i++) d[i] = r() * 2 - 1;
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    },
    stop() { this.live.forEach((n) => { try { n.stop(); } catch (e) {} }); this.live = []; },
    start(from) {
      this.stop();
      const ctx = this.ensure(); if (!ctx) return;
      const now = ctx.currentTime + 0.05, mg = Math.pow(10, (this.master.gain || 0) / 20);
      this.out.gain.cancelScheduledValues(0);
      this.out.gain.setValueAtTime(this.muted ? 0 : mg, now);
      const fo = this.master.fadeOut || 0;
      if (fo && !this.muted) { const fs = now + Math.max(0, Player.END - fo - from); this.out.gain.setValueAtTime(mg, fs); this.out.gain.linearRampToValueAtTime(0.0001, now + Math.max(0.01, Player.END - from)); }
      for (const e of this.events) { if (e.t < from - 0.02) continue; const at = now + (e.t - from); try { this.play(e, at); } catch (err) {} }
    },
    env(g, at, peak, a, d) { g.gain.setValueAtTime(0.0001, at); g.gain.linearRampToValueAtTime(peak, at + a); g.gain.exponentialRampToValueAtTime(0.0001, at + a + d); },
    osc(type, f, at, end, dest) { const o = this.ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, at); o.connect(dest); o.start(at); o.stop(end); this.live.push(o); return o; },
    noiseSrc(at, end, dest) { const s = this.ctx.createBufferSource(); s.buffer = this.noise; s.loop = true; s.connect(dest); s.start(at); s.stop(end); this.live.push(s); return s; },
    filt(type, f, q, dest) { const b = this.ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q || 0.7; b.connect(dest); return b; },
    gain(dest) { const g = this.ctx.createGain(); g.connect(dest); return g; },
    play(e, at) {
      const ctx = this.ctx, v = Math.min(1.3, e.v / 100);
      if (e.k === 'note') {
        const pr = this.programs[e.track] || { patch: 'keys' }, f = hz(e.m), pg = Math.pow(10, (pr.gain || 0) / 20) * v;
        const g = this.gain(this.out);
        switch (pr.patch) {
          case 'pad': { const lp = this.filt('lowpass', 1400, 0.5, g); g.gain.setValueAtTime(0.0001, at); g.gain.linearRampToValueAtTime(0.06 * pg, at + 0.4); g.gain.setValueAtTime(0.06 * pg, at + e.d); g.gain.linearRampToValueAtTime(0.0001, at + e.d + 0.8); this.osc('sawtooth', f, at, at + e.d + 0.9, lp).detune.value = -7; this.osc('sawtooth', f, at, at + e.d + 0.9, lp).detune.value = 7; break; }
          case 'bass': { this.env(g, at, 0.32 * pg, 0.01, Math.min(1.2, e.d + 0.3)); const lp = this.filt('lowpass', 600, 1, g); this.osc('triangle', f, at, at + e.d + 0.5, lp); this.osc('sine', f, at, at + e.d + 0.5, g); break; }
          case 'marimba': case 'vibes': { this.env(g, at, 0.22 * pg, 0.004, pr.patch === 'vibes' ? 1.2 : 0.45); this.osc('sine', f, at, at + 1.3, g); const g2 = this.gain(g); g2.gain.value = 0.25; this.osc('sine', f * 4, at, at + 0.15, g2); break; }
          case 'glock': { this.env(g, at, 0.12 * pg, 0.002, 1.4); this.osc('sine', f, at, at + 1.5, g); const g2 = this.gain(g); g2.gain.value = 0.3; this.osc('sine', f * 2.76, at, at + 0.5, g2); break; }
          case 'pluck': { this.env(g, at, 0.14 * pg, 0.003, 0.35); const lp = this.filt('lowpass', 2400, 1, g); this.osc('triangle', f, at, at + 0.5, lp); break; }
          case 'ep': case 'keys': default: { const dd = Math.min(1.6, e.d + 0.4); this.env(g, at, 0.12 * pg, 0.006, dd); this.osc('sine', f, at, at + dd + 0.1, g); const g2 = this.gain(g); g2.gain.value = 0.35; this.osc('triangle', f * 2, at, at + dd * 0.5, g2); }
        }
        return;
      }
      if (e.k === 'drum') {
        const g = this.gain(this.out);
        switch (e.name) {
          case 'kick': { this.env(g, at, 0.7 * v, 0.002, 0.3); const o = this.osc('sine', 140, at, at + 0.35, g); o.frequency.exponentialRampToValueAtTime(45, at + 0.2); break; }
          case 'snare': case 'clap': { this.env(g, at, 0.3 * v, 0.002, e.name === 'clap' ? 0.18 : 0.2); this.noiseSrc(at, at + 0.25, this.filt('bandpass', 1500, 0.8, g)); break; }
          case 'sidestick': case 'woodblock': { this.env(g, at, 0.25 * v, 0.001, 0.05); this.noiseSrc(at, at + 0.08, this.filt('bandpass', 2200, 4, g)); break; }
          case 'hat': case 'shaker': case 'tamb': { this.env(g, at, (e.name === 'shaker' ? 0.09 : 0.12) * v, 0.003, 0.06); this.noiseSrc(at, at + 0.1, this.filt('highpass', 7000, 0.7, g)); break; }
          case 'openhat': case 'crash': case 'ride': { this.env(g, at, 0.12 * v, 0.003, 1.4); this.noiseSrc(at, at + 1.5, this.filt('highpass', 5000, 0.7, g)); break; }
          default: { this.env(g, at, 0.2 * v, 0.002, 0.2); this.osc('sine', 200, at, at + 0.25, g); }
        }
        return;
      }
      // effects
      const g = this.gain(this.out), p = e.pitch || 1;
      switch (e.name) {
        case 'tick': case 'click': case 'doubleclick': { this.env(g, at, 0.12 * v, 0.001, 0.025); this.noiseSrc(at, at + 0.04, this.filt('bandpass', 3200 * p, 3, g)); break; }
        case 'pop': { this.env(g, at, 0.25 * v, 0.002, 0.09); const o = this.osc('sine', 500 * p, at, at + 0.12, g); o.frequency.exponentialRampToValueAtTime(1100 * p, at + 0.06); break; }
        case 'ding': { this.env(g, at, 0.2 * v, 0.002, 1.1); this.osc('sine', 1318.5 * p, at, at + 1.2, g); const g2 = this.gain(g); g2.gain.value = 0.3; this.osc('sine', 2637 * p, at, at + 0.6, g2); break; }

    const breathe = 1 + 0.01 * Math.sin(2 * Math.PI * Math.max(0, t - 5.5) / 3);
    this.name.parentElement.style.transform = 'scale(' + breathe.toFixed(4) + ')';
  },
});
});</script>
<script>Player.score(function (kit) {
kit.score(function (S, T) {
  // Before the app: only the comedy. Buzzing phones, a boing, keyboard clacks that stop dead, a sad wah-wah.
  S.program('wah', 'keys', { gain: -2, bright: 0.2 });
  for (let b = 0; b < 4; b++) { const s = T.hook + 0.1 + b * 0.9; const ts = []; for (let k = 0; k < 9; k++) ts.push(s + k * 0.045); S.ticks(ts, { vel: 26 }); }
  S.fx('boing', T.hook + 3.0, { vel: 75 });
  S.fx('thud', T.hook + 3.75, { vel: 45 });
  const r = (function (seed) { let x = seed; return () => (x = (x * 16807) % 2147483647) / 2147483647; })(9);
  const clacks = []; let c = T.desk + 0.15;
  while (c < T.twice + 0.2) { clacks.push(c); c += 0.06 + r() * 0.07 - 0.03 * ((c - T.desk) / 5); }
  S.ticks(clacks, { vel: 40 });
  S.fx('pop', T.twice + 0.6, { vel: 40 });
  const w = T.twice + 3.25;
  S.note('wah', 'Bb3', { t: w, dur: 0.4, vel: 64 });
  S.note('wah', 'A3', { t: w + 0.45, dur: 0.4, vel: 62 });
  S.note('wah', 'Ab3', { t: w + 0.9, dur: 0.4, vel: 60 });
  S.note('wah', 'G3', { t: w + 1.35, dur: 1.1, vel: 66 });

  // From the app on: light, upbeat. Bar 12 lands on the end card's name.
  const hit = T.close + 5.0, B = (hit - T.home) / 48;
  S.tempo(60 / B, { t0: T.home });
  S.program('mallet', 'marimba', { rev: 0.2 });
  S.program('ep', 'ep', { gain: -4, rev: 0.3 });
  S.program('bass', 'bass');
  S.program('glock', 'glock', { gain: -6, rev: 0.4 });
  const ch = [['C4', 'E4', 'G4', 'B4'], ['A3', 'C4', 'E4', 'G4'], ['F3', 'A3', 'C4', 'E4'], ['G3', 'B3', 'D4', 'F4']];
  const rt = ['C2', 'A1', 'F1', 'G1'];
  const mel = [['E5', 'G5', 'C6', 'G5'], ['E5', 'C5', 'A4', 'C5'], ['F5', 'A5', 'C6', 'A5'], ['G5', 'D5', 'B4', 'D5']];
  for (let b = 0; b < 12; b++) {
    const beat = 4 * b, k = b % 4, soft = b < 1 ? 0.6 : b >= 10 ? 0.7 : 1;
    S.pattern('ep', 'x..x..x.', { from: beat, repeat: 1, pitch: [ch[k][0]], vel: 0 });
    S.chord('ep', ch[k], { beat, beats: 1, vel: Math.round(46 * soft) });
    S.chord('ep', ch[k], { beat: beat + 1.5, beats: 0.5, vel: Math.round(38 * soft) });
    S.chord('ep', ch[k], { beat: beat + 3, beats: 0.5, vel: Math.round(40 * soft) });
    S.note('bass', rt[k], { beat, beats: 1.5, vel: 72 * soft });
    S.note('bass', rt[k], { beat: beat + 2, beats: 0.5, vel: 58 * soft });
    S.note('bass', rt[k], { beat: beat + 2.5, beats: 1, vel: 62 * soft });
    if (b >= 2 && b <= 9) S.pattern('mallet', 'x.xxX.x.', { from: beat, repeat: 1, pitch: mel[k], vel: 58 });
  }
  S.drums({ kick: 'x...x...', clap: '..x...x.', shaker: 'xoxoxoxo' }, { from: 4, repeat: 9 });
  S.drums({ shaker: 'o.o.o.o.' }, { from: 40, repeat: 2 });
  // The bright final note.
  S.chord('ep', ['C4', 'E4', 'G4', 'B4', 'D5'], { beat: 48, beats: 6, vel: 70 });
  S.chord('mallet', ['C5', 'E5', 'G5', 'C6'], { beat: 48, beats: 4, vel: 84 });
  S.note('glock', 'G6', { beat: 48, beats: 4, vel: 70 });
  S.note('bass', 'C2', { beat: 48, beats: 4, vel: 84 });
  S.drum('kick', { beat: 48, vel: 92 });
  S.drum('crash', { beat: 48, vel: 50 });

  // A soft ding for each of the three moments.
  S.fx('ding', T.sync + 0.82, { vel: 55 });
  S.fx('ding', T.alert + 0.72, { vel: 55 });
  S.fx('ding', T.payouts + 1.22, { vel: 55 });
  S.fx('whoosh', T.home, { dur: 0.6, vel: 30, into: 1 });
  S.fx('pop', T.close + 1.3, { vel: 40 });
  S.master({ gain: -6, fadeOut: 1.5 });
});
});</script>
<script>Player.boot();</script>
