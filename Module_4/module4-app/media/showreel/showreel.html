<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Showreel 26</title>
<meta name="viewport" content="width=1080, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: #0C0C14; overflow: hidden; }
  canvas { display: block; position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
/* =====================================================================
   SHOWREEL '26 — a 15-second motion reel.
   Every pixel is a pure function of time: seek(t) redraws the frame.
   No CSS animation, no timers, no rAF state.
   ===================================================================== */
const W = 1080, H = 1080, DUR = 15, FPS = 60;
const C = {
  ink: '#0C0C14', paper: '#F3EFE6', coral: '#FF4B2B',
  blue: '#2B3DFF', acid: '#D4FF3A', deep: '#1A27C9'
};
const DISPLAY = '"Segoe UI Black", "Segoe UI", Arial, sans-serif';
const MONO = 'Consolas, "Cascadia Mono", monospace';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const off = document.createElement('canvas'); off.width = W; off.height = H;
const octx = off.getContext('2d');

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2;
const E = {
  outCubic: k => 1 - Math.pow(1 - k, 3),
  inOutCubic: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  outExpo: k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k),
  inExpo: k => k <= 0 ? 0 : Math.pow(2, 10 * k - 10),
  inOutExpo: k => k <= 0 ? 0 : k >= 1 ? 1 : k < .5 ? Math.pow(2, 20 * k - 10) / 2 : (2 - Math.pow(2, -20 * k + 10)) / 2,
  outBack: k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
  outElastic: k => k <= 0 ? 0 : k >= 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - .75) * TAU / 3) + 1,
};
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

/* ---------- drawing helpers ---------- */
function bg(g, col) { g.fillStyle = col; g.fillRect(0, 0, W, H); }
function fitSize(g, text, maxW, maxSize, spEm = 0) {
  g.font = `900 100px ${DISPLAY}`;
  let w = 0; for (const ch of text) w += g.measureText(ch).width;
  const perPx = w / 100 + spEm * (text.length - 1);
  return Math.min(maxSize, maxW / perPx);
}
// Per-letter text. fn(i, n) -> {dx, dy, s, sy, rot, a}
function letters(g, text, size, cx, by, opts, fn) {
  g.font = `900 ${size}px ${DISPLAY}`;
  const sp = (opts.sp || 0) * size;
  const ws = [...text].map(ch => g.measureText(ch).width);
  const total = ws.reduce((a, b) => a + b, 0) + sp * (text.length - 1);
  let x = cx - total / 2;
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  for (let i = 0; i < text.length; i++) {
    const o = fn ? fn(i, text.length) : {};
    g.save();
    g.translate(x + ws[i] / 2 + (o.dx || 0), by + (o.dy || 0));
    if (o.rot) g.rotate(o.rot);
    if (o.s != null || o.sy != null) g.scale(o.s == null ? 1 : o.s, o.sy == null ? (o.s == null ? 1 : o.s) : o.sy);
    g.globalAlpha *= (o.a == null ? 1 : o.a);
    if (opts.stroke) { g.lineWidth = opts.lw || 3; g.strokeStyle = opts.color; g.lineJoin = 'round'; g.strokeText(text[i], 0, 0); }
    else { g.fillStyle = opts.color; g.fillText(text[i], 0, 0); }
    g.restore();
    x += ws[i] + sp;
  }
  return total;
}
function mono(g, text, x, y, size, col, align = 'left', spacing = 0) {
  g.font = `700 ${size}px ${MONO}`;
  g.fillStyle = col; g.textBaseline = 'alphabetic';
  if (!spacing) { g.textAlign = align; g.fillText(text, x, y); return; }
  const cw = g.measureText('M').width + spacing;
  const tw = cw * text.length - spacing;
  let sx = align === 'center' ? x - tw / 2 : align === 'right' ? x - tw : x;
  g.textAlign = 'left';
  for (let i = 0; i < text.length; i++) g.fillText(text[i], sx + i * cw, y);
}
function blobPath(g, cx, cy, R, t, seed) {
  g.beginPath();
  const N = 140;
  for (let i = 0; i <= N; i++) {
    const a = i / N * TAU;
    const r = R * (1 + .10 * Math.sin(3 * a + t * 2.1 + seed) + .07 * Math.sin(5 * a - t * 3.3 + seed * 2) + .04 * Math.sin(8 * a + t * 5.0 + seed * 3));
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath();
}
function rrect(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.roundRect(x, y, w, h, r);
}

/* =====================================================================
   SCENES  (120 BPM -> one beat = 0.5 s)
   ===================================================================== */

/* 01 — ORIGIN: a dot becomes a line becomes a horizon for type. 0.0–2.0 */
const LY = 600;
function s1(g, t) {
  bg(g, C.ink);
  const p1 = prog(t, .05, .4), p2 = prog(t, .4, .85);
  g.fillStyle = C.paper;
  if (t < .4) {
    const r = 18 * E.outBack(p1);
    if (r > 0) { g.beginPath(); g.arc(540, LY, r, 0, TAU); g.fill(); }
  } else {
    const lw = lerp(36, 920, E.inOutExpo(p2)), lh = lerp(36, 6, E.outCubic(p2));
    rrect(g, 540 - lw / 2, LY - lh / 2, lw, lh, lh / 2); g.fill();
    // coral light running along the horizon
    const sw = prog(t, 1.2, 1.75);
    if (sw > 0 && sw < 1) {
      const x0 = 80 + E.inOutCubic(sw) * 920;
      const grd = g.createLinearGradient(x0 - 260, 0, x0, 0);
      grd.addColorStop(0, 'rgba(255,75,43,0)'); grd.addColorStop(1, C.coral);
      g.fillStyle = grd; g.fillRect(Math.max(80, x0 - 260), LY - 3, Math.min(260, x0 - 80), 6);
    }
  }
  // MOTION rises out of the horizon
  const sz1 = fitSize(g, 'MOTION', 900, 270, -.01);
  g.save(); g.beginPath(); g.rect(0, 0, W, LY - 4); g.clip();
  letters(g, 'MOTION', sz1, 540, LY - 30, { color: C.paper, sp: -.01 }, i => {
    const k = E.outExpo(prog(t, .72 + i * .05, 1.25 + i * .05));
    return { dy: (1 - k) * sz1 * 1.05 };
  });
  g.restore();
  // DESIGNER drops beneath it, outlined
  const sz2 = fitSize(g, 'DESIGNER', 900, 270, .02);
  g.save(); g.beginPath(); g.rect(0, LY + 4, W, H); g.clip();
  letters(g, 'DESIGNER', sz2, 540, LY + 30 + sz2 * .72, { color: C.paper, stroke: true, lw: 3, sp: .02 }, i => {
    const k = E.outExpo(prog(t, .95 + i * .04, 1.45 + i * .04));
    return { dy: -(1 - k) * sz2 * 1.05 };
  });
  g.restore();
  const k3 = prog(t, 1.25, 1.6);
  const msg = 'a reel in 900 frames';
  mono(g, msg.slice(0, Math.round(k3 * msg.length)), 540, 880, 24, C.acid, 'center', 4);
}

/* 02 — KINETIC TYPE: one word per beat, four techniques. 2.0–4.0 */
const RING = ' MOTION DESIGN — SHOWREEL 2026 — EVERY FRAME = f(t) —';
function s2(g, t) {
  const lt = t - 2;
  bg(g, C.coral);
  // rotating type ring
  g.save(); g.translate(540, 540); g.rotate(lt * .55 - .3);
  g.font = `700 22px ${MONO}`; g.fillStyle = C.ink; g.textAlign = 'center';
  const n = RING.length * 2;
  for (let i = 0; i < n; i++) {
    g.save(); g.rotate(i / n * TAU); g.fillText((RING + RING)[i], 0, -430); g.restore();
  }
  g.restore();
  // beat pulse
  const bp = ((lt % .5) + .5) % .5 / .5;
  g.strokeStyle = C.ink; g.globalAlpha = (1 - bp) * .5; g.lineWidth = 3;
  g.beginPath(); g.arc(540, 540, 140 + E.outExpo(bp) * 250, 0, TAU); g.stroke();
  g.globalAlpha = 1;

  const words = ['SHAPE', 'TIME', 'RHYTHM', 'FEEL'];
  const idx = clamp(Math.floor(lt / .5), 0, 3);
  const wl = lt - idx * .5;
  const word = words[idx];
  const size = fitSize(g, word, 780, 290, -.01);
  const by = 540 + size * .36;
  if (idx === 0) {
    // slide + skew + trails
    for (let k = 4; k >= 0; k--) {
      const e = E.outExpo(prog(wl - k * .025, 0, .38));
      g.save(); g.translate((1 - e) * -1000, 0);
      g.transform(1, 0, -.35 * (1 - e), 1, 0, 0);
      g.globalAlpha = k === 0 ? 1 : .14;
      letters(g, word, size, 540 + (1 - e) * 0, by, { color: k ? C.paper : C.ink, sp: -.01 });
      g.restore();
    }
  } else if (idx === 1) {
    // scale slam + shake
    const e = E.outExpo(prog(wl, 0, .28));
    const s = 1 + 2.6 * (1 - e);
    const sh = (1 - prog(wl, .12, .32)) * (wl > .12 ? 1 : 0) * 14;
    g.save(); g.translate(540 + (hash(Math.floor(wl * 60)) - .5) * sh, 540 + (hash(Math.floor(wl * 60) + 9) - .5) * sh);
    g.scale(s, s); g.translate(-540, -540);
    g.globalAlpha = prog(wl, 0, .06);
    letters(g, word, size, 540, by, { color: C.ink, sp: -.01 });
    g.restore();
  } else if (idx === 2) {
    // letter drop with overshoot + spin
    letters(g, word, size, 540, by, { color: C.ink, sp: -.01 }, i => {
      const k = prog(wl, i * .035, .26 + i * .035);
      return { dy: -(1 - E.outBack(k)) * 700, rot: (1 - E.outCubic(k)) * (i % 2 ? .6 : -.6), a: k > 0 ? 1 : 0 };
    });
  } else {
    // split halves sliding in from opposite sides
    const e = E.outExpo(prog(wl, 0, .34));
    const mid = by - size * .36;
    g.save(); g.beginPath(); g.rect(0, 0, W, mid); g.clip();
    letters(g, word, size, 540 + (1 - e) * 900, by, { color: C.ink, sp: -.01 }); g.restore();
    g.save(); g.beginPath(); g.rect(0, mid, W, H); g.clip();
    letters(g, word, size, 540 - (1 - e) * 900, by, { color: C.ink, sp: -.01 }); g.restore();
  }
  // beat counter dots
  for (let i = 0; i < 4; i++) {
    g.fillStyle = C.ink; g.globalAlpha = i <= idx ? 1 : .25;
    g.beginPath(); g.arc(540 - 45 + i * 30, by + 70, 7, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
}

/* 03 — PROCEDURAL GRID: a wave morphs circles into squares. 4.0–6.5 */
const sqSize = t => lerp(64, 230, E.outExpo(prog(t - 4, 1.62, 2.1)));
const sqRot = t => E.outExpo(prog(t - 4, 1.62, 2.1)) * Math.PI * .75 + (t - 4) * .6;
function s3(g, t) {
  const lt = t - 4;
  bg(g, C.ink);
  const P = 100;
  for (let j = 0; j < 9; j++) for (let i = 0; i < 9; i++) {
    const di = i - 4, dj = j - 4, d = Math.hypot(di, dj);
    const center = d === 0;
    const pop = E.outBack(prog(lt, d * .055, d * .055 + .4));
    const w = lt * 4.2 - d * .95;
    const osc = .5 + .5 * Math.sin(w);
    const col = clamp(prog(lt - d * .025, 1.5, 2.0));
    const c = E.inOutExpo(col);
    let x = 540 + di * P, y = 540 + dj * P;
    x = lerp(x, 540, c); y = lerp(y, 540, c);
    let s = 66 * pop * (.45 + .55 * osc);
    let rot = osc * Math.PI / 2 + (di - dj) * .05;
    let rad = s / 2 * (1 - osc);
    let fill = osc > .55 ? C.acid : C.paper;
    if (center) {
      s = lt > 1.5 ? sqSize(t) : s;
      rot = lt > 1.5 ? sqRot(t) : rot;
      rad = lt > 1.5 ? lerp(rad, 0, prog(lt, 1.5, 1.7)) : rad;
      fill = C.coral;
    } else {
      s *= (1 - c);
    }
    if (s <= .5) continue;
    g.save(); g.translate(x, y); g.rotate(rot);
    rrect(g, -s / 2, -s / 2, s, s, rad);
    if (!center && (i + j) % 4 === 0 && d > 2.5) { g.strokeStyle = fill; g.lineWidth = 4; g.stroke(); }
    else { g.fillStyle = fill; g.fill(); }
    g.restore();
  }
}

/* 04 — DIMENSION: a torus knot in perspective, drawn on then shattered. 6.5–9.0 */
const KN = 720;
function knotPoint(u) {
  const p = 2, q = 5;
  const r = 2 + Math.cos(q * u);
  return [r * Math.cos(p * u), r * Math.sin(p * u), -Math.sin(q * u) * 1.1];
}
function s4(g, t) {
  const lt = t - 6.5;
  bg(g, C.blue);
  // soft depth glow
  const rg = g.createRadialGradient(540, 540, 40, 540, 540, 620);
  rg.addColorStop(0, 'rgba(120,140,255,.55)'); rg.addColorStop(1, 'rgba(26,39,201,0)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);

  const ay = lt * 1.15 + .4, ax = .75 + .25 * Math.sin(lt * 1.4);
  const cy = Math.cos(ay), sy = Math.sin(ay), cx = Math.cos(ax), sx = Math.sin(ax);
  const draw = E.outCubic(prog(lt, 0, .85));
  const ex = E.inExpo(prog(lt, 1.85, 2.4));
  const scale = 105 * (1 + .08 * E.outBack(prog(lt, .7, 1.2)));
  const proj = (v) => {
    let [x, y, z] = v;
    let x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
    let y1 = y * cx - z1 * sx, z2 = y * sx + z1 * cx;
    const k = 1 + ex * 4.5;
    x1 *= k; y1 *= k; z2 *= k;
    const f = 6 / (6 + z2 * .9);
    return [540 + x1 * scale * f, 540 + y1 * scale * f, z2, f];
  };
  // orbit rings
  g.strokeStyle = 'rgba(243,239,230,.28)'; g.lineWidth = 2;
  for (let r = 0; r < 2; r++) {
    g.save(); g.translate(540, 540); g.rotate(lt * (r ? -.5 : .4) + r);
    g.beginPath(); g.ellipse(0, 0, 440 - r * 40, 120 + r * 50, 0, 0, TAU * draw); g.stroke();
    g.restore();
  }
  const segs = [];
  const nDraw = Math.floor(KN * draw);
  let prev = null;
  for (let i = 0; i <= nDraw; i++) {
    const P = proj(knotPoint(i / KN * TAU));
    if (prev) segs.push([prev, P, (prev[2] + P[2]) / 2]);
    prev = P;
  }
  segs.sort((a, b) => b[2] - a[2]);
  g.lineCap = 'round';
  for (const [a, b, z] of segs) {
    const near = clamp((-z + 3.2) / 6.4);
    g.strokeStyle = `rgb(${lerp(120, 243, near) | 0},${lerp(135, 239, near) | 0},${lerp(255, 230, near) | 0})`;
    g.lineWidth = lerp(2, 15, near) * a[3] * (1 - ex * .6);
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
  }
  // beads travelling along the knot
  if (draw >= 1) for (let k = 0; k < 7; k++) {
    const u = ((k / 7 + lt * .12) % 1) * TAU;
    const P = proj(knotPoint(u));
    g.fillStyle = k % 3 ? C.acid : C.coral;
    g.beginPath(); g.arc(P[0], P[1], 13 * P[3] * (1 - ex), 0, TAU); g.fill();
  }
  // pen head while drawing
  if (draw < 1 && draw > 0) {
    const P = proj(knotPoint(draw * TAU));
    g.fillStyle = C.acid; g.beginPath(); g.arc(P[0], P[1], 14, 0, TAU); g.fill();
  }
}

/* 05 — FLUID: a living blob inverts the type it passes over. 9.0–11.5 */
function s5(g, t) {
  const lt = t - 9;
  bg(g, C.paper);
  const size = fitSize(g, 'FLUID', 880, 330, .02);
  const by = 540 + size * .36;
  const breathe = .02 + .03 * Math.sin(lt * 3);
  const txt = (col) => letters(g, 'FLUID', size, 540, by, { color: col, sp: breathe }, i => {
    const k = E.outExpo(prog(lt, .15 + i * .05, .65 + i * .05));
    return { sy: k, a: k > 0 ? 1 : 0, dy: Math.sin(lt * 4 + i * .9) * 10 };
  });
  txt(C.ink);
  const bx = 540 + 70 * Math.sin(lt * 1.3), byy = 540 + 50 * Math.cos(lt * 1.7);
  const R = 300 * E.outElastic(prog(lt, 0, 1.0)) + 1300 * E.inExpo(prog(lt, 2.05, 2.5));
  if (R > 1) {
    blobPath(g, bx, byy, R, lt, 1); g.fillStyle = C.coral; g.fill();
    g.save(); blobPath(g, bx, byy, R, lt, 1); g.clip(); txt(C.paper); g.restore();
  }
  const a = lt * 2.2 - .5;
  const r2 = 105 * E.outBack(prog(lt, .35, .85)) * (1 - E.inExpo(prog(lt, 1.9, 2.3)));
  if (r2 > 1) {
    const ox = 540 + Math.cos(a) * 330, oy = 540 + Math.sin(a) * 300;
    blobPath(g, ox, oy, r2, lt * 1.6, 4); g.fillStyle = C.ink; g.fill();
    g.save(); blobPath(g, ox, oy, r2, lt * 1.6, 4); g.clip(); txt(C.acid); g.restore();
  }
}

/* 06 — MONTAGE: six eighth-note cuts. 11.5–13.0 */
function s6(g, t) {
  const lt = t - 11.5;
  const cut = clamp(Math.floor(lt / .25), 0, 5);
  const cl = lt - cut * .25;
  const z = 1 + .07 * (cl / .25);
  g.save(); g.translate(540, 540); g.scale(z, z); g.translate(-540, -540);
  if (cut === 0) {
    bg(g, C.acid); g.strokeStyle = C.ink; g.lineWidth = 20;
    for (let r = (cl * 700) % 72 + 10; r < 900; r += 72) { g.beginPath(); g.arc(540, 540, r, 0, TAU); g.stroke(); }
    g.fillStyle = C.ink; g.beginPath(); g.arc(540, 540, 60, 0, TAU); g.fill();
  } else if (cut === 1) {
    bg(g, C.ink); g.save(); g.translate(540, 540); g.rotate(Math.PI / 4 + cl * 2);
    g.fillStyle = C.coral; for (let x = -1000; x < 1000; x += 90) g.fillRect(x, -1000, 45, 2000); g.restore();
    g.fillStyle = C.ink; g.beginPath(); g.arc(540, 540, 230, 0, TAU); g.fill();
    letters(g, 'x5', 200, 540, 540 + 72, { color: C.paper });
  } else if (cut === 2) {
    bg(g, C.paper);
    const s = 720 * E.outExpo(prog(cl, 0, .16));
    g.save(); g.translate(540, 540); g.rotate(-.08 + cl * .4); g.fillStyle = C.blue; g.fillRect(-s / 2, -s / 2, s, s); g.restore();
    const sz = fitSize(g, '60', 640, 640);
    letters(g, '60', sz, 540, 540 + sz * .36, { color: C.paper, sp: -.02 });
  } else if (cut === 3) {
    bg(g, C.blue); g.fillStyle = C.paper;
    for (let j = 0; j < 6; j++) for (let i = 0; i < 6; i++) {
      if ((i + j) % 2) continue;
      const sx = Math.cos(cl * 14 + (i + j) * .55);
      g.save(); g.translate(i * 180 + 90, j * 180 + 90); g.scale(sx, 1); g.fillRect(-90, -90, 180, 180); g.restore();
    }
  } else if (cut === 4) {
    bg(g, C.coral); g.save(); g.translate(540, 540); g.rotate(cl * 2.5);
    g.fillStyle = C.paper;
    for (let k = 0; k < 18; k++) {
      const a0 = k / 18 * TAU, a1 = a0 + TAU / 36;
      g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a0) * 1100, Math.sin(a0) * 1100); g.lineTo(Math.cos(a1) * 1100, Math.sin(a1) * 1100); g.fill();
    }
    g.restore();
    g.fillStyle = C.ink; g.beginPath(); g.arc(540, 540, 150, 0, TAU); g.fill();
  } else {
    bg(g, C.ink);
    const sz = fitSize(g, 'FPS', 800, 400, .02);
    for (let k = 3; k >= 1; k--) {
      const s = 1 + k * .14 * E.outExpo(prog(cl, 0, .2));
      g.save(); g.translate(540, 540); g.scale(s, s); g.translate(-540, -540); g.globalAlpha = .55 / k;
      letters(g, 'FPS', sz, 540, 540 + sz * .36, { color: C.acid, stroke: true, lw: 3, sp: .02 }); g.restore();
    }
    const s = lerp(.7, 1, E.outExpo(prog(cl, 0, .18)));
    g.save(); g.translate(540, 540); g.scale(s, s); g.translate(-540, -540);
    letters(g, 'FPS', sz, 540, 540 + sz * .36, { color: C.acid, sp: .02 }); g.restore();
  }
  g.restore();
}

/* 07 — RESOLVE: the reel's three shapes assemble into a mark. 13.0–15.0 */
function triPath(g, s) { const h = s * .9; g.beginPath(); g.moveTo(0, -h * .62); g.lineTo(s * .56, h * .45); g.lineTo(-s * .56, h * .45); g.closePath(); }
function s7(g, t) {
  const lt = t - 13;
  bg(g, C.ink);
  const S = 150, Y = 400, GAP = 190;
  // impact ring
  const ir = prog(lt, 0, .6);
  if (ir > 0 && ir < 1) { g.strokeStyle = C.paper; g.globalAlpha = 1 - ir; g.lineWidth = 2; g.beginPath(); g.arc(540, Y, 100 + E.outExpo(ir) * 700, 0, TAU); g.stroke(); g.globalAlpha = 1; }
  const e1 = E.outExpo(prog(lt, .0, .5)), e2 = E.outExpo(prog(lt, .08, .58)), e3 = E.outExpo(prog(lt, .16, .66));
  // square (blue) from the left
  g.save(); g.translate(lerp(-300, 540 - GAP, e1), Y); g.rotate((1 - e1) * -Math.PI + Math.sin(lt * 2) * .04);
  g.fillStyle = C.blue; g.fillRect(-S / 2, -S / 2, S, S); g.restore();
  // circle (coral) from above
  g.save(); g.translate(540, lerp(-300, Y, e2));
  const br = 1 + .03 * Math.sin(lt * 7);
  g.fillStyle = C.coral; g.beginPath(); g.arc(0, 0, S / 2 * br, 0, TAU); g.fill(); g.restore();
  // triangle (acid) from the right
  g.save(); g.translate(lerp(1380, 540 + GAP, e3), Y + 6); g.rotate((1 - e3) * Math.PI * 1.5);
  g.fillStyle = C.acid; triPath(g, S * 1.05); g.fill(); g.restore();
  // wordmark
  const sz = fitSize(g, 'SHOWREEL', 820, 170, .04);
  const base = 690;
  g.save(); g.beginPath(); g.rect(0, 0, W, base + 8); g.clip();
  letters(g, 'SHOWREEL', sz, 540, base, { color: C.paper, sp: .04 }, i => {
    const k = E.outExpo(prog(lt, .38 + i * .045, .9 + i * .045));
    return { dy: (1 - k) * sz * 1.1 };
  });
  g.restore();
  // rule + tagline
  const rw = 760 * E.inOutExpo(prog(lt, .75, 1.25));
  g.fillStyle = C.acid; g.fillRect(540 - rw / 2, base + 36, rw, 3);
  const tag = 'MOTION · DESIGN · DIRECTION — 2026';
  const k = prog(lt, .95, 1.45);
  mono(g, tag.slice(0, Math.round(k * tag.length)), 540, base + 90, 26, C.paper, 'center', 3);
  g.globalAlpha = E.outCubic(prog(lt, 1.35, 1.7));
  mono(g, 'every frame = f(t)', 540, base + 190, 22, C.acid, 'center', 2);
  g.globalAlpha = 1;
}

/* ---------- scene table + transitions ---------- */
const SCENES = [
  { a: 0, b: 2, f: s1, name: 'ORIGIN' },
  { a: 2, b: 4, f: s2, name: 'KINETIC TYPE' },
  { a: 4, b: 6.5, f: s3, name: 'PROCEDURAL GRID' },
  { a: 6.5, b: 9, f: s4, name: 'DIMENSION' },
  { a: 9, b: 11.5, f: s5, name: 'FLUID' },
  { a: 11.5, b: 13, f: s6, name: 'MONTAGE' },
  { a: 13, b: 15.01, f: s7, name: 'RESOLVE' },
];
// mask of the NEXT scene, drawn over the end of scene i
const TRANS = [
  { d: .3, mask: (g, t) => { const r = E.inExpo(prog(t, 1.7, 2)) * 820; g.beginPath(); g.arc(540, LY, Math.max(r, .01), 0, TAU); } },
  { d: .35, mask: (g, t) => { g.beginPath(); for (let k = 0; k < 8; k++) { const h = E.inOutExpo(prog(t, 3.65 + k * .025, 3.85 + k * .025)) * H; g.rect(k * 135, 0, 135, h); } } },
  { d: .3, mask: (g, t) => { const s = sqSize(t) + E.inExpo(prog(t, 6.2, 6.5)) * 1400; g.save(); g.translate(540, 540); g.rotate(sqRot(t)); g.beginPath(); g.rect(-s / 2, -s / 2, s, s); g.restore(); } },
  { d: .3, mask: (g, t) => { const s = E.inOutExpo(prog(t, 8.7, 9)) * 2300 - 100; g.beginPath(); g.moveTo(-100, -100); g.lineTo(s, -100); g.lineTo(-100, s); g.closePath(); } },
  null, null, null,
];
function drawScene(g, t) {
  let i = SCENES.findIndex(s => t >= s.a && t < s.b);
  if (i < 0) i = t < 0 ? 0 : SCENES.length - 1;
  g.save(); SCENES[i].f(g, t); g.restore();
  const tr = TRANS[i];
  if (tr && t > SCENES[i].b - tr.d) {
    g.save(); tr.mask(g, t); g.clip(); SCENES[i + 1].f(g, t); g.restore();
  }
  return i;
}

/* ---------- film grain (seeded, deterministic) ---------- */
const grain = document.createElement('canvas'); grain.width = grain.height = 256;
(() => {
  const gx = grain.getContext('2d'), im = gx.createImageData(256, 256);
  let s = 1234567;
  for (let p = 0; p < im.data.length; p += 4) {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    const v = (s >> 8) & 255;
    im.data[p] = im.data[p + 1] = im.data[p + 2] = v; im.data[p + 3] = 255;
  }
  gx.putImageData(im, 0, 0);
})();

/* ---------- HUD ---------- */
const pad2 = n => String(n).padStart(2, '0');
function hud(g, t, si) {
  const a = E.outCubic(prog(t, .15, .6));
  if (a <= 0) return;
  g.save();
  g.globalCompositeOperation = 'difference';
  g.globalAlpha = a * .9;
  g.strokeStyle = '#fff'; g.lineWidth = 3;
  const m = 36, L = 28;
  for (const [x, y, sx, sy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) {
    g.beginPath(); g.moveTo(x, y + sy * L); g.lineTo(x, y); g.lineTo(x + sx * L, y); g.stroke();
  }
  const fr = Math.round(t * FPS);
  mono(g, 'REEL_26', 58, 76, 20, '#fff', 'left', 2);
  mono(g, `${pad2(si + 1)} / 07`, W - 58, 76, 20, '#fff', 'right', 2);
  mono(g, `TC 00:00:${pad2(Math.floor(fr / FPS))}:${pad2(fr % FPS)}`, 58, H - 56, 20, '#fff', 'left', 1);
  mono(g, SCENES[si].name, 540, H - 56, 18, '#fff', 'center', 4);
  g.fillStyle = '#fff'; g.globalAlpha = a * .35; g.fillRect(W - 258, H - 64, 200, 4);
  g.globalAlpha = a * .9; g.fillRect(W - 258, H - 64, 200 * clamp(t / DUR), 4);
  g.restore();
}

/* ---------- seek(t): the only entry point ---------- */
const SUB = 5, SHUTTER = .5 / FPS; // 180-degree shutter, 5 sub-samples
function seek(t) {
  t = clamp(t, 0, DUR - 1e-4);
  let si = 0;
  for (let k = 0; k < SUB; k++) {
    const ts = Math.min(t + SHUTTER * k / SUB, DUR - 1e-4);
    octx.setTransform(1, 0, 0, 1, 0, 0);
    octx.globalAlpha = 1; octx.globalCompositeOperation = 'source-over';
    const s = drawScene(octx, ts);
    if (k === 0) si = s;
    ctx.globalAlpha = 1 / (k + 1);
    ctx.drawImage(off, 0, 0);
  }
  ctx.globalAlpha = 1;
  // grain
  const fr = Math.round(t * FPS);
  ctx.save();
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .07;
  const ox = Math.floor(hash(fr) * 256), oy = Math.floor(hash(fr + 77) * 256);
  for (let y = -oy; y < H; y += 256) for (let x = -ox; x < W; x += 256) ctx.drawImage(grain, x, y);
  ctx.restore();
  // vignette
  const vg = ctx.createRadialGradient(540, 540, 420, 540, 540, 800);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  hud(ctx, t, si);
}
window.seek = seek;

(async () => {
  await document.fonts.ready;
  seek(0);
  window.__ready = true;
})();
</script>
